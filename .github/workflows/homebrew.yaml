name: Homebrew Releaser

on:
  release:
    types:
    - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to use'
        required: true
        type: string

jobs:
  homebrew:
    uses: openmcp-project/build/.github/workflows/homebrew.lib.yaml@main
    with:
      username: Diaphteiros
      tap: homebrew-kubeswitcher
      readme_table: true
      tag: ${{ inputs.tag }}
      test: |
        assert_match(/^v\d/, shell_output("#{bin}/kw_mcp version"))
    secrets:
      token: ${{ secrets.HOMEBREW_KUBESWITCHER_TOKEN }}
